[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geojax"
version = "0.1.0"
description = "Riemannian geometry and manifold optimization in JAX."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "GeoJAX contributors" }
]
keywords = [
  "jax",
  "riemannian-geometry",
  "manifold-optimization",
  "matrix-manifolds"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "jax>=0.6",
  "numpy>=1.26",
]

[project.urls]
Homepage = "https://www.kisungyou.com/geojax/"
Documentation = "https://www.kisungyou.com/geojax/"
Repository = "https://github.com/kisungyou/geojax"
Issues = "https://github.com/kisungyou/geojax/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "build>=1.2",
  "twine>=5",
]
docs = [
  "sphinx>=8.2",
  "pydata-sphinx-theme>=0.16",
  "myst-nb>=1.2",
  "sphinx-copybutton>=0.5",
  "matplotlib>=3.8",
]
examples = [
  "matplotlib>=3.8",
  "pandas>=2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["geojax*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
