name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: make quality

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            precision: float32
            x64: "0"
            jax: "0.6.0"
            numpy: "1.26.4"
            dependencies: min
          - python: "3.11"
            precision: float64
            x64: "1"
            jax: "0.6.0"
            numpy: "1.26.4"
            dependencies: min
          - python: "3.11"
            precision: float32
            x64: "0"
            jax: "0.10.2"
            numpy: "2.4.4"
            dependencies: stable
          - python: "3.11"
            precision: float64
            x64: "1"
            jax: "0.10.2"
            numpy: "2.4.4"
            dependencies: stable
          - python: "3.12"
            precision: float32
            x64: "0"
            jax: "0.11.0"
            numpy: "2.4.4"
            dependencies: stable
          - python: "3.12"
            precision: float64
            x64: "1"
            jax: "0.11.0"
            numpy: "2.4.4"
            dependencies: stable
          - python: "3.13"
            precision: float32
            x64: "0"
            jax: "0.11.0"
            numpy: "2.4.4"
            dependencies: stable
          - python: "3.13"
            precision: float64
            x64: "1"
            jax: "0.11.0"
            numpy: "2.4.4"
            dependencies: stable
          - python: "3.14"
            precision: float32
            x64: "0"
            jax: "0.11.0"
            numpy: "2.4.4"
            dependencies: stable
          - python: "3.14"
            precision: float64
            x64: "1"
            jax: "0.11.0"
            numpy: "2.4.4"
            dependencies: stable
    name: tests-py${{ matrix.python }}-${{ matrix.precision }}-${{ matrix.dependencies }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install build
          "jax==${{ matrix.jax }}" "jaxlib==${{ matrix.jax }}"
          "numpy==${{ matrix.numpy }}" "scipy==1.17.1"
          "ml-dtypes==0.5.4" "opt-einsum==3.4.0"
          "pytest==9.0.3" "pytest-cov==7.1.0" "coverage==7.13.5"
      - run: python -m build --wheel --outdir dist
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m pip check
      - env:
          GEOJAX_TEST_X64: ${{ matrix.x64 }}
          PYTHONHASHSEED: "0"
        run: >-
          python -I scripts/run_test_suite.py
          --repository "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/geojax-tests"
          --timeout 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-py${{ matrix.python }}-${{ matrix.precision }}-${{ matrix.dependencies }}
          path: ${{ runner.temp }}/geojax-tests
          include-hidden-files: true
          if-no-files-found: warn

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m build --sdist --wheel --outdir dist
      - run: python -m twine check --strict dist/*
      - run: python scripts/smoke_package.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: geojax-distributions
          path: dist/*
          if-no-files-found: error

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[docs,examples]"
      - run: make website
      - uses: actions/upload-artifact@v4
        with:
          name: geojax-documentation
          path: site
          if-no-files-found: error
