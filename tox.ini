[tox]
requires =
    tox>=4.58,<5
    tox-uv>=1.36,<2
env_list =
    py311-min-float32
    py311-min-float64
    py311-stable-float32
    py311-stable-float64
    py312-stable-float32
    py312-stable-float64
    py313-stable-float32
    py313-stable-float64
    py314-stable-float32
    py314-stable-float64
skip_missing_interpreters = false

[testenv]
description = Run the complete suite with {base_python}, {env_name}
runner = uv-venv-runner
uv_python_preference = only-managed
package = wheel
deps =
    min: jax==0.6.0
    min: jaxlib==0.6.0
    min: numpy==1.26.4
    py311-stable: jax==0.10.2
    py311-stable: jaxlib==0.10.2
    py312-stable: jax==0.11.0
    py312-stable: jaxlib==0.11.0
    py313-stable: jax==0.11.0
    py313-stable: jaxlib==0.11.0
    py314-stable: jax==0.11.0
    py314-stable: jaxlib==0.11.0
    stable: numpy==2.4.4
    scipy==1.17.1
    ml-dtypes==0.5.4
    opt-einsum==3.4.0
    pytest==9.0.3
    pytest-cov==7.1.0
    coverage==7.13.5
set_env =
    COVERAGE_FILE={env_tmp_dir}/.coverage
    PYTHONHASHSEED=0
    float32: GEOJAX_TEST_X64=0
    float64: GEOJAX_TEST_X64=1
commands =
    python -m pytest --cov --cov-report=term-missing
    python -m coverage report --include=geojax/learning/* --fail-under=95
