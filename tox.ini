[tox]
requires = tox>=4.25
env_list =
    py311-min-float32
    py311-min-float64
    py311-latest-float32
    py311-latest-float64
    py312-latest-float32
    py312-latest-float64
    py313-latest-float32
    py313-latest-float64
skip_missing_interpreters = false

[testenv]
description = Run the complete suite with {base_python}, {env_name}
package = wheel
extras = dev
deps =
    min: jax==0.6.0
    min: numpy==1.26.*
    latest: jax>=0.6
    latest: numpy>=1.26
set_env =
    float32: GEOJAX_TEST_X64=0
    float64: GEOJAX_TEST_X64=1
commands =
    python -m pytest --cov=geojax --cov-report=term-missing
